<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Roman Uzay Teleskobu 3D</title>
<style>
:root{--bg:#04060d;--panel:rgba(10,14,26,.88);--line:rgba(140,170,220,.25);--txt:#e6ecf7;--mut:#9fb0cc;--acc:#39c6ff;--acc2:#ffc53d}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--txt);font-family:"Segoe UI",system-ui,sans-serif;overflow:hidden}
#c{position:fixed;inset:0;display:block}
#hud{position:fixed;top:14px;left:14px;display:flex;flex-direction:column;gap:8px;z-index:5;max-width:calc(100vw - 28px)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 12px;backdrop-filter:blur(8px)}
.title{font-weight:700;font-size:14px;letter-spacing:.04em;text-transform:uppercase}
.title small{display:block;font-weight:400;color:var(--mut);text-transform:none;letter-spacing:0;font-size:12px;margin-top:2px}
.row{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
button{background:rgba(255,255,255,.06);border:1px solid var(--line);color:var(--txt);border-radius:8px;padding:6px 10px;font-size:12.5px;cursor:pointer;transition:.15s;font-family:inherit}
select{background:#0a0e1a;border:1px solid var(--line);color:var(--txt);border-radius:8px;padding:6px;font:inherit;font-size:12.5px}button:focus-visible,select:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
button:hover{background:rgba(255,255,255,.14)}
button.on{background:rgba(57,198,255,.22);border-color:var(--acc);color:#fff}
button.warn.on{background:rgba(255,197,61,.22);border-color:var(--acc2)}
label.sl{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--mut)}
input[type=range]{width:150px;accent-color:var(--acc)}
#tip{position:fixed;pointer-events:none;z-index:9;background:rgba(6,10,20,.92);border:1px solid var(--acc);color:#fff;padding:5px 9px;border-radius:7px;font-size:13px;white-space:nowrap;opacity:0;transform:translate(14px,14px);transition:opacity .12s}
#tip.inner{border-color:var(--acc2)}
#panel{position:fixed;top:0;right:0;height:100%;width:370px;max-width:92vw;background:var(--panel);border-left:1px solid var(--line);backdrop-filter:blur(10px);transform:translateX(105%);transition:transform .35s cubic-bezier(.2,.8,.2,1);z-index:6;overflow-y:auto;padding:18px 20px 30px}
#panel.open{transform:none}
#panel h2{margin:6px 0 2px;font-size:20px;padding-right:34px}
#panel .sub{color:var(--acc);font-size:13px;margin-bottom:12px}
#panel .sub.y{color:var(--acc2)}
#panel p{line-height:1.55;font-size:14px;color:#d7dfee}
#panel ul{padding-left:18px;margin:8px 0}
#panel li{margin:5px 0;font-size:13.5px;line-height:1.45}
#panel .tag{display:inline-block;font-size:11px;padding:2px 8px;border-radius:99px;background:rgba(255,255,255,.08);color:var(--mut);margin-bottom:4px}
#panel .tag.y{background:rgba(255,197,61,.15);color:var(--acc2)}
#close{position:absolute;top:12px;right:12px;width:30px;height:30px;padding:0;border-radius:50%}
#panel h4{margin:16px 0 4px;font-size:12px;color:var(--mut);text-transform:uppercase;letter-spacing:.06em}
#panel .act{margin-top:14px}
#step{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);z-index:5;font-size:14px;padding:9px 16px;opacity:0;transition:opacity .3s;max-width:80vw;text-align:center;pointer-events:none}
#step.show{opacity:1}
#step b{color:var(--acc)}
#step .y{color:var(--acc2)}
#hint{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);color:var(--mut);font-size:12.5px;z-index:4;transition:opacity 1s;text-align:center;pointer-events:none}
#load{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;color:var(--mut);font-size:14px;z-index:20;background:var(--bg);transition:opacity .5s}
.svgbox{background:rgba(0,0,0,.35);border:1px solid var(--line);border-radius:10px;padding:8px;margin:10px 0}
@media (max-width:700px){input[type=range]{width:110px}.title small{display:none}}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="load">3D model yükleniyor…</div>
<div id="hud">
 <div class="card"><div class="title"><span id="heading">Nancy Grace Roman Uzay Teleskobu</span><small id="subtitle">İnteraktif 3D model · fareyi parçanın üstüne getir, tıkla, parçalara ayır</small></div></div>
 <div class="card row">
   <label class="sl"><span id="explodeLabel">Parçalara ayır</span> <input id="explode" type="range" min="0" max="100" value="0"></label>
   <button id="bAssemble">Birleştir</button><button id="bExplode">Patlat</button>

  if (!Object.hasOwn(messages, next)) return;
  language = next;
  const t = messages[language];

  for (const id of ['heading','subtitle','load','explodeLabel','bAssemble','bExplode','bInside','bLight','bDims','bRot','bReset','bL2','hint']) {

const parts={}, shells=[], shellEdges=[], explodeGroups=[];
function reg(mesh,id,layer='outer',shell=false){
  mesh.userData={partId:id,layer,shell};
  (parts[id]??={meshes:[]}).meshes.push(mesh);
  const m=mesh.material; m.userData.em=m.emissive.getHex(); m.userData.emi=m.emissiveIntensity;
  if(shell){ shells.push(mesh);
    const e=new THREE.LineSegments(new THREE.EdgesGeometry(mesh.geometry,25),new THREE.LineBasicMaterial({color:0x7fc4ff,transparent:true,opacity:.45}));
    e.visible=false; mesh.add(e); shellEdges.push(e); }
  return mesh;
}
function eg(base,off){const g=new THREE.Group();g.position.copy(base);g.userData.base=base.clone();g.userData.off=off.clone();scene.add(g);explodeGroups.push(g);return g;}
function strut(g,a,b,r=0.03,mat=M.strut,id='truss'){
  const A=new THREE.Vector3(...a),B=new THREE.Vector3(...b),d=B.clone().sub(A),L=d.length();
  const m=new THREE.Mesh(new THREE.CylinderGeometry(r,r,L,8),mat());
  m.position.copy(A).add(B).multiplyScalar(.5); m.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0),d.normalize());
  g.add(reg(m,id)); return m;
}

  for(let i=0;i<4;i++){const a=i/4*Math.PI*2+Math.PI/4;const th=new THREE.Mesh(new THREE.ConeGeometry(.08,.22,16).rotateZ(-Math.PI/2),M.dark());th.position.set(1.08,Math.cos(a)*1.2,Math.sin(a)*1.2);gBus.add(reg(th,'bus'));}
  const tank=new THREE.Mesh(new THREE.SphereGeometry(.62,32,32),M.foil()); gBus.add(reg(tank,'bus_tank','inner'));
  const wl=[[-.5,.95,.5,0],[-.5,-.95,.5,1],[-.5,0,-1.05,2]];
  for(const [x,y,z,k] of wl){const w=new THREE.Mesh(new THREE.CylinderGeometry(.26,.26,.1,32),M.dark());w.position.set(x,y,z);w.rotation.set(k===2?Math.PI/2:0,0,k===0?0:Math.PI/2);gBus.add(reg(w,'bus_wheels','inner'));}
  // anten
  const dish=new THREE.Mesh(new THREE.CylinderGeometry(.58,.16,.2,40,1,true).rotateZ(-Math.PI/2),M.foil()); dish.material.side=THREE.DoubleSide; dish.position.set(1.45,-.9,1.1); gBus.add(reg(dish,'antenna'));
  const feed=new THREE.Mesh(new THREE.CylinderGeometry(.02,.02,.4,8).rotateZ(Math.PI/2),M.dark()); feed.position.set(1.62,-.9,1.1); gBus.add(reg(feed,'antenna'));
  strut(gBus,[.9,-1.1,1.2],[1.35,-.9,1.1],.03,M.dark,'antenna');
}

/* ---------------- GÜNEŞ PANELLERİ ---------------- */
const gSolar=eg(new THREE.Vector3(0.3,-2.6,0.55),new THREE.Vector3(0,-1.8,0));
{ for(let i=0;i<5;i++){ const x=(i-2)*1.42;
    const p=new THREE.Mesh(new THREE.BoxGeometry(1.36,1.9,.05),M.panel()); p.position.set(x,0,0); p.rotation.x=-.32; gSolar.add(reg(p,'solar'));
    const grid=new THREE.LineSegments(new THREE.EdgesGeometry(new THREE.PlaneGeometry(1.36,1.9,4,6)),new THREE.LineBasicMaterial({color:0x5a78c8,transparent:true,opacity:.35})); grid.position.z=.03; p.add(grid);
    const fr=new THREE.Mesh(new THREE.BoxGeometry(1.42,1.96,.03),M.dark()); fr.position.z=-.02; p.add(reg(fr,'solar')); }
  strut(gSolar,[-2.9,.95,-.3],[2.9,.95,-.3],.04,M.silver,'solar');
  for(const x of [-2.1,0,2.1]) strut(gSolar,[x,.95,-.3],[x,1.8,-.55],.03,M.silver,'solar');
}

/* ---------------- BOYUT ÇİZGİLERİ ---------------- */
function textSprite(txt,w=3.2){const c=document.createElement('canvas');c.width=1024;c.height=128;const x=c.getContext('2d');
  x.font='bold 46px Segoe UI, sans-serif';x.fillStyle='#fff';x.textAlign='center';x.textBaseline='middle';x.shadowColor='#000';x.shadowBlur=8;x.fillText(txt,512,64);
  const s=new THREE.Sprite(new THREE.SpriteMaterial({map:new THREE.CanvasTexture(c),transparent:true,depthTest:false}));s.scale.set(w,w/8,1);return s;}
const dimensionLabels=[];
function dimensionSprite(index,width){const sprite=textSprite(i18n.ui.dimensions[index],width);dimensionLabels.push({sprite,index});return sprite;}
function translateDimensions(){for(const {sprite,index} of dimensionLabels){const fresh=textSprite(i18n.ui.dimensions[index]);sprite.material.map.dispose();sprite.material.map=fresh.material.map;sprite.material.needsUpdate=true;fresh.material.dispose();}}
const dims=new THREE.Group(); dims.visible=false; scene.add(dims);
{ const mat=new THREE.LineBasicMaterial({color:0xffffff,transparent:true,opacity:.8});
  const L=(a,b)=>dims.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(...a),new THREE.Vector3(...b)]),mat));
  L([-7.6,-4.4,0],[5.6,-4.4,0]); L([-7.6,-4.1,0],[-7.6,-4.7,0]); L([5.6,-4.1,0],[5.6,-4.7,0]);
  const t1=dimensionSprite(0,9); t1.position.set(-1,-4.9,0); dims.add(t1);
  L([6.6,1.75,0],[6.6,-2.65,0]); L([6.3,1.75,0],[6.9,1.75,0]); L([6.3,-2.65,0],[6.9,-2.65,0]);
  const t2=dimensionSprite(1,4.5); t2.position.set(7.4,-.45,0); dims.add(t2);
  const t3=dimensionSprite(2,5); t3.position.set(-0.55,2.0,0); dims.add(t3);
  L([-0.55,1.25,0],[-0.55,1.75,0]);
}

/* ---------------- IŞIK YOLU ---------------- */
const NP=110, photons=[];
for(let i=0;i<NP;i++) photons.push({ang:Math.random()*Math.PI*2, r:.45+Math.random()*.68, t:Math.random(), cgi:i%2===1});
const pGeo=new THREE.BufferGeometry();
pGeo.setAttribute('position',new THREE.BufferAttribute(new Float32Array(NP*3),3));
pGeo.setAttribute('color',new THREE.BufferAttribute(new Float32Array(NP*3),3));
const photonPts=new THREE.Points(pGeo,new THREE.PointsMaterial({size:.17,map:glowTex('rgba(255,255,255,1)','rgba(255,255,255,0)'),vertexColors:true,transparent:true,depthWrite:false,blending:THREE.AdditiveBlending}));
photonPts.visible=false; scene.add(photonPts);
const NRAY=8, nSeg=NRAY*2+3;
const lGeo=new THREE.BufferGeometry();
lGeo.setAttribute('position',new THREE.BufferAttribute(new Float32Array(nSeg*6),3));
lGeo.setAttribute('color',new THREE.BufferAttribute(new Float32Array(nSeg*6),3));
const guide=new THREE.LineSegments(lGeo,new THREE.LineBasicMaterial({vertexColors:true,transparent:true,opacity:.5}));
guide.visible=false; scene.add(guide);
const CY=new THREE.Color(0x39c6ff), YE=new THREE.Color(0xffc53d);
const _v=new THREE.Vector3();
const wp=o=>o.getWorldPosition(new THREE.Vector3());
const STEPS_TR=[
 '<b>1/4</b> Yıldız ışığı paralel ışınlar halinde tüpün açık ucundan girer',
 '<b>2/4</b> Birincil ayna (2,4 m) ışığı toplayıp öne, ikincil aynaya yansıtır',
 '<b>3/4</b> İkincil ayna ışığı birincil aynanın ortasındaki delikten geriye gönderir',
 '<b>4/4</b> Işık ayrılır: <b>Geniş Alan Aleti (mavi)</b> ve <span class="y">Koronagraf (sarı)</span>'];
const STEPS_EN=[
 '<b>1/4</b> Starlight enters the open end of the tube as parallel rays',
 '<b>2/4</b> The primary mirror (2.4 m) collects the light and reflects it forward to the secondary mirror',
 '<b>3/4</b> The secondary mirror sends the light back through the hole at the center of the primary mirror',
 '<b>4/4</b> The light splits: <b>Wide Field Instrument (blue)</b> and <span class="y">Coronagraph (yellow)</span>'];
let STEPS=i18n.language==='en'?STEPS_EN:STEPS_TR;
let lightOn=false, lastStep=-1;
function updateLight(dt){
  const Pp=wp(primaryMesh), Ps=wp(secondaryMesh), Pw=wp(wfiDet), Pc=wp(cgiDM1);
  const Psplit=Pp.clone().add(_v.set(1.0,0,0));
  const pos=pGeo.attributes.position.array, col=pGeo.attributes.color.array;
  let step0=0;
  for(let i=0;i<NP;i++){const p=photons[i];
    p.t=(p.t+dt*.16)%1;
    const entry=Pp.clone().add(_v.set(-.05,Math.cos(p.ang)*p.r,Math.sin(p.ang)*p.r));
    const start=entry.clone().add(_v.set(-8.5,0,0));
    const dest=p.cgi?Pc:Pw;
    const pts=[start,entry,Ps,Psplit,dest];
    const lens=[];let tot=0;for(let k=0;k<4;k++){const l=pts[k].distanceTo(pts[k+1]);lens.push(l);tot+=l;}
    let d=p.t*tot,k=0;while(k<3&&d>lens[k]){d-=lens[k];k++;}
    const q=pts[k].clone().lerp(pts[k+1],d/lens[k]);
    pos[i*3]=q.x;pos[i*3+1]=q.y;pos[i*3+2]=q.z;
    const c=(k===3&&p.cgi)?YE:CY; col[i*3]=c.r;col[i*3+1]=c.g;col[i*3+2]=c.b;
    if(i===0)step0=k;
  }
  pGeo.attributes.position.needsUpdate=true; pGeo.attributes.color.needsUpdate=true;
  // kılavuz çizgiler
  const lp=lGeo.attributes.position.array, lc=lGeo.attributes.color.array; let n=0;
  const seg=(a,b,c)=>{lp.set([a.x,a.y,a.z,b.x,b.y,b.z],n*6);lc.set([c.r,c.g,c.b,c.r,c.g,c.b],n*6);n++;};
  for(let i=0;i<NRAY;i++){const a=i/NRAY*Math.PI*2+.3,r=.95;const e=Pp.clone().add(_v.set(-.05,Math.cos(a)*r,Math.sin(a)*r));seg(e.clone().add(_v.set(-8.5,0,0)),e,CY);seg(e,Ps,CY);}
  seg(Ps,Psplit,CY); seg(Psplit,Pw,CY); seg(Psplit,Pc,YE);
  lGeo.attributes.position.needsUpdate=true; lGeo.attributes.color.needsUpdate=true;
  if(step0!==lastStep){lastStep=step0;stepEl.innerHTML=STEPS[step0];}
}

/* ---------------- ETKİLEŞİM ---------------- */
const tip=document.getElementById('tip'), panel=document.getElementById('panel'), pc=document.getElementById('pc'), stepEl=document.getElementById('step');
const ray=new THREE.Raycaster(), mouse=new THREE.Vector2(-9,-9);
let targets=[], inside=false, hover=null, selected=null, moved=false;
function rebuildTargets(){ targets=[]; for(const id in parts) for(const m of parts[id].meshes){ const u=m.userData;
  if(u.layer==='both'||(u.layer==='outer'&&!(inside&&u.shell))||(u.layer==='inner'&&inside)) targets.push(m);} }
rebuildTargets();
function glow(id,on,strong){ if(!id||!parts[id])return; const inner=isInner(id);
  for(const m of parts[id].meshes){ const mt=m.material; if(on){mt.emissive.setHex(inner?0xffc53d:0x39c6ff);mt.emissiveIntensity=strong?.6:.35;}else{mt.emissive.setHex(mt.userData.em);mt.emissiveIntensity=mt.userData.emi;} } }
function setHover(id){ if(id===hover)return; if(hover&&hover!==selected)glow(hover,false); hover=id;
  if(hover){glow(hover,true,hover===selected);tip.textContent=INFO[hover].name;tip.classList.toggle('inner',isInner(hover));tip.style.opacity=1;canvas.style.cursor='pointer';}
  else{tip.style.opacity=0;canvas.style.cursor='';} }
function select(id){ if(selected&&selected!==id)glow(selected,false); selected=id; if(id){glow(id,true,true);openPanel(id);} else panel.classList.remove('open'); }
let panelId=null;
function openPanel(id){ panelId=id; const I=INFO[id]; const inner=isInner(id);
  let h=`<span class="tag ${inner?'y':''}">${I.layer}</span><h2>${I.name}</h2><div class="sub ${inner?'y':''}">${I.sub}</div>`;
  if(id==='l2')h+=L2SVG();
  h+=`<p>${I.desc}</p><h4>${i18n.ui.highlights}</h4><ul>${I.facts.map(f=>`<li>${f}</li>`).join('')}</ul>`;
  const acts=[];
  if(['barrel','wfi','cgi','bus'].includes(id)&&!inside)acts.push(`<button data-act="inside">${i18n.ui.inside}</button>`);
  if(['primary','secondary','wfi','cgi','wfi_detector','cgi_dm1','cgi_dm2'].includes(id))acts.push(`<button data-act="light">${i18n.ui.light}</button>`);
  if(id!=='l2')acts.push(`<button data-act="focus">${i18n.ui.focus}</button>`);
  if(acts.length)h+=`<div class="act row">${acts.join('')}</div>`;
  pc.innerHTML=h; panel.classList.add('open');
  pc.querySelectorAll('[data-act]').forEach(b=>b.onclick=()=>{const a=b.dataset.act; if(a==='inside')setInside(true); if(a==='light')setLight(true); if(a==='focus')focusOn(id);});
}
document.getElementById('close').onclick=()=>select(null);
canvas.addEventListener('pointermove',e=>{mouse.x=e.clientX/innerWidth*2-1;mouse.y=-(e.clientY/innerHeight*2-1);tip.style.left=e.clientX+'px';tip.style.top=e.clientY+'px';moved=true;});
canvas.addEventListener('pointerleave',()=>{mouse.set(-9,-9);moved=true;});
let downAt=null;
canvas.addEventListener('pointerdown',e=>{downAt=[e.clientX,e.clientY];});
canvas.addEventListener('pointerup',e=>{ if(!downAt)return; const dx=e.clientX-downAt[0],dy=e.clientY-downAt[1]; downAt=null; if(dx*dx+dy*dy>25)return;
  if(hover){select(hover);focusOn(hover);} else select(null); });

/* ---------------- KAMERA ---------------- */
let camTween=null;
function tweenCam(p1,c1,dur=950){camTween={t0:performance.now(),dur,p0:camera.position.clone(),p1,c0:controls.target.clone(),c1};}
function focusOn(id){ if(!parts[id])return; scene.updateMatrixWorld(true); const box=new THREE.Box3(); for(const m of parts[id].meshes)box.expandByObject(m);
  const c=box.getCenter(new THREE.Vector3()), s=box.getSize(new THREE.Vector3()).length();
  const dir=camera.position.clone().sub(controls.target).normalize(); tweenCam(c.clone().add(dir.multiplyScalar(Math.max(s*2.0,3.2))),c); }

/* ---------------- MODLAR ---------------- */
const $=id=>document.getElementById(id);
let explodeTarget=0, explodeCur=0;
$('explode').oninput=e=>{explodeTarget=e.target.value/100;};
$('bAssemble').onclick=()=>{explodeTarget=0;$('explode').value=0;};
$('bExplode').onclick=()=>{explodeTarget=1;$('explode').value=100;};
function setInside(on){ inside=on; $('bInside').classList.toggle('on',on);
  for(const m of shells){m.material.transparent=on;m.material.opacity=on?.08:1;m.material.depthWrite=!on;m.material.needsUpdate=true;}
  for(const e of shellEdges)e.visible=on; rebuildTargets(); setHover(null); moved=true;
  if(selected&&parts[selected])openPanel(selected); }
$('bInside').onclick=()=>setInside(!inside);
function setLight(on){ lightOn=on; $('bLight').classList.toggle('on',on); photonPts.visible=on; guide.visible=on; stepEl.classList.toggle('show',on); lastStep=-1; if(on)$('hint').style.opacity=0; }
$('bLight').onclick=()=>setLight(!lightOn);
$('bDims').onclick=()=>{dims.visible=!dims.visible;$('bDims').classList.toggle('on',dims.visible);};
$('bRot').onclick=()=>{controls.autoRotate=!controls.autoRotate;$('bRot').classList.toggle('on',controls.autoRotate);};
$('bReset').onclick=()=>{tweenCam(HOME_POS.clone(),HOME_TGT.clone());};
$('bL2').onclick=()=>{ if(selected)glow(selected,false); selected=null; openPanel('l2'); };
setTimeout(()=>{$('hint').style.opacity=0;},9000);

window.addEventListener('roman-languagechange',()=>{
 INFO=i18n.language==='en'?INFO_EN:INFO_TR;
 STEPS=i18n.language==='en'?STEPS_EN:STEPS_TR;
 translateDimensions();
 if(panel.classList.contains('open')&&panelId)openPanel(panelId);
 if(hover)tip.textContent=INFO[hover].name;
 if(lastStep>=0)stepEl.innerHTML=STEPS[lastStep];
});

/* ---------------- DÖNGÜ ---------------- */
function resize(){const w=innerWidth,h=innerHeight;renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix();}
addEventListener('resize',resize); resize();
const clock=new THREE.Clock();
function loop(){ requestAnimationFrame(loop); const dt=Math.min(clock.getDelta(),.05);
  explodeCur+=(explodeTarget-explodeCur)*Math.min(1,dt*5);
  for(const g of explodeGroups)g.position.copy(g.userData.base).addScaledVector(g.userData.off,explodeCur);
  if(camTween){const k=Math.min(1,(performance.now()-camTween.t0)/camTween.dur),e=1-Math.pow(1-k,3);camera.position.lerpVectors(camTween.p0,camTween.p1,e);controls.target.lerpVectors(camTween.c0,camTween.c1,e);if(k>=1)camTween=null;}
  controls.update();
  if(moved){moved=false; ray.setFromCamera(mouse,camera); const hit=ray.intersectObjects(targets,false)[0]; setHover(hit?hit.object.userData.partId:null);}
  if(lightOn)updateLight(dt);
  renderer.render(scene,camera);
}
loop();
const ld=$('load'); ld.style.opacity=0; setTimeout(()=>ld.remove(),600);
</script>
